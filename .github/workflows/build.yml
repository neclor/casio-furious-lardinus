name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  PYTHONEXTRA_TAG: pe-0.4.0-beta

jobs:
  build:
    name: Compile game to .mpy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Pillow
        run: pip install Pillow

      - name: Build gint textures
        run: python tools/build_gint_textures.py

      - name: Clone PythonExtra source (mpy-cross)
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$PYTHONEXTRA_TAG" \
            https://git.planet-casio.com/Lephenixnoir/PythonExtra.git \
            "$RUNNER_TEMP/pythonextra-src"

      - name: Build mpy-cross
        run: make -C "$RUNNER_TEMP/pythonextra-src/mpy-cross"

      - name: Compile game to .mpy
        run: |
          python tools/build_mpy.py \
            "$RUNNER_TEMP/pythonextra-src/mpy-cross/build/mpy-cross" \
            game/src \
            "$RUNNER_TEMP/build-check-out"
