name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)release
        required: true

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  ASSET_BASENAME: game
  PYTHONEXTRA_G1A: tools/PythonExtra-pe-0.4.0-beta/PythonEx.g1a
  PYTHONEXTRA_TAG: pe-0.4.0-beta

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            push)              tag="$GITHUB_REF_NAME" ;;
            release)           tag="$RELEASE_TAG" ;;
            workflow_dispatch) tag="$INPUT_TAG" ;;
            *) echo "::error::unexpected event '$GITHUB_EVENT_NAME'"; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Pillow
        run: pip install Pillow

      - name: Build gint textures
        run: python tools/build_gint_textures.py

      - name: Clone PythonExtra source (mpy-cross)
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$PYTHONEXTRA_TAG" \
            https://git.planet-casio.com/Lephenixnoir/PythonExtra.git \
            "$RUNNER_TEMP/pythonextra-src"

      - name: Build mpy-cross
        run: make -C "$RUNNER_TEMP/pythonextra-src/mpy-cross"

      - name: Package calculator game files
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          MPY_CROSS: ${{ runner.temp }}/pythonextra-src/mpy-cross/build/mpy-cross
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/package/game"
          mkdir -p "$stage"

          # Precompiles every .py to .mpy bytecode in one pass (except main.py,
          # the entry point PythonExtra launches from its file browser), so the
          # calculator never has to compile from source on-device -- by far the
          # most memory-hungry step on its tiny heap.
          python tools/build_mpy.py "$MPY_CROSS" game/src "$stage/src"
          # Older tags kept gamekit as a sibling "lib" folder instead of nesting
          # it under src; compile it too so re-releasing those tags still works.
          if [ -d game/lib ]; then
            python tools/build_mpy.py "$MPY_CROSS" game/lib "$stage/lib"
          fi

          find "$stage" -type d -name "__pycache__" -prune -exec rm -rf {} +
          find "$stage" -name "*.pyc" -delete
          find "$stage/src/assets" -name "*.png" -delete
          find "$stage/src/assets/fonts" -type f -delete

          (cd "$RUNNER_TEMP/package" && zip -r "$GITHUB_WORKSPACE/$ASSET_BASENAME-$TAG.zip" game)

      - name: Copy PythonExtra g1a
        run: cp "$PYTHONEXTRA_G1A" "$GITHUB_WORKSPACE/PythonEx.g1a"

      - name: Attest release asset provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            ${{ env.ASSET_BASENAME }}-${{ steps.tag.outputs.tag }}.zip
            PythonEx.g1a

      - name: Publish release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # Tag push / manual run: stage a draft as the approval gate.
          # `release: published` only fires once the draft is published, and the
          # release already exists by then, so create is skipped.
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --generate-notes --draft
          gh release upload "$TAG" "$ASSET_BASENAME-$TAG.zip" PythonEx.g1a --clobber
